# Serving public/ with nginx instead of server/server.mjs (no /api/files then: point saveUrl at
# your own backend). Adjust the paths and the pages allowed to embed the worker.
server {
    listen 443 ssl http2;
    server_name docs.example.com;
    root /srv/ufile-worker/public;

    types {
        text/html html;
        text/javascript js mjs;
        text/css css;
        application/json json;
        application/wasm wasm;
        image/svg+xml svg;
        font/ttf ttf;
        font/otf otf;
        application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
        application/vnd.openxmlformats-officedocument.presentationml.presentation pptx;
        application/pdf pdf;
    }

    # The engines and the worker may be framed only by these pages ('self' frames the engines).
    add_header Content-Security-Policy "frame-ancestors 'self' https://intranet.example.com" always;
    add_header X-Content-Type-Options nosniff always;

    # Precompressed copies made by scripts/precompress.mjs (needs ngx_brotli for .br).
    gzip_static on;
    # brotli_static on;

    location ~* ^/engines/.+-[0-9a-f]{8,}.*\.(js|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    # The font pack keeps each font release in its own folder (scripts/fetch-fonts.sh).
    location ~* ^/fonts/[^/]+/[^/]+\.(ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' https://intranet.example.com" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
